[theme]
# Your brand color
primaryColor = "#FF484B"

# The main background (Deep Black)
backgroundColor = "#0E1117"

# The button/input background (Dark Slate)
# This MUST be a dark color so text stays white on top of it
secondaryBackgroundColor = "#262730"

# The default text color
textColor = "#FFFFFF"

# Fallback font
font = "sans serif"

# Essential for mobile: tells Streamlit to use Dark logic for all widgets
base = "dark"

[server]
enableCORS = false
enableXsrfProtection = false