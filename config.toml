[theme]
# Matches your brand red/orange
primaryColor = "#FF484B"

# Deep dark background (Matches your CSS)
backgroundColor = "#0E1117"

# Lighter grey so buttons/inputs are naturally visible on mobile
secondaryBackgroundColor = "#262730"

# Pure white for all base text
textColor = "#FFFFFF"

# Fallback font
font = "sans serif"

# Critical: tells Streamlit to use Dark Mode logic globally
base = "dark"

[server]
enableCORS = false
enableXsrfProtection = false